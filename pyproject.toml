[project]
name = "forge"
version = "0.1.0"
description = "Forge - Distributed Job Platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.138.2",
    "prometheus-client>=0.23.1",
    "psycopg[binary]>=3.2.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sentence-transformers>=3.3.0",
    "sqlalchemy>=2.0.51",
    # Transitive via sentence-transformers, declared here so the CPU-index pin in
    # [tool.uv.sources] applies -- uv only redirects sources for declared dependencies.
    "torch>=2.14.0",
    "uvicorn[standard]>=0.49.0",
]

# Dev tooling. Manage with `uv add` / `uv add --dev`; exact versions pinned in uv.lock.
[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
    "testcontainers[postgres,redis]>=4.15.0",
]

# ---------------------------------------------------------------------------
# Dependency resolution (uv)
# ---------------------------------------------------------------------------
# No build backend: app/ and worker/ are run in place, not installed as a
# distribution, so uv manages the environment and nothing else.
[tool.uv]
package = false

# sentence-transformers pulls torch, and torch on PyPI means the CUDA build: several
# GB of nvidia-* wheels this project can never use, since the whole point is that it
# runs on CPU. Linux (every container image) resolves torch from the CPU-only index
# instead. macOS wheels are CPU-only already, so local development stays on PyPI and
# the lockfile keeps both.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

# ---------------------------------------------------------------------------
# Linting & formatting (ruff) — replaces flake8 + isort + black, one fast tool.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (likely bugs)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TC",  # flake8-type-checking
]
ignore = ["E501"]  # line length handled by the formatter

[tool.ruff.lint.isort]
known-first-party = ["app", "worker"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI helpers are designed to be called in argument defaults (idiomatic).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
]

# ---------------------------------------------------------------------------
# Static type checking (mypy) — strict, since type safety is part of the bar.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

# ---------------------------------------------------------------------------
# Tests (pytest) — async-aware; tests mirror the app/ package layout.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: loads the embedding model; deselect with -m 'not slow'",
]
